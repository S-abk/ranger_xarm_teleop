# Deployment profile: Gazebo on one simulation workstation. SIMULATION ONLY.
# Everything that differs between set-ups lives here (contract, Deployments); the profile is
# copied into every session.json and every episode sidecar. Checker tolerances are relative to
# the nominal rates given here (config/checks.yaml).
name: gazebo
simulation: true
use_sim_time: true              # recorder receive times and robot-side stamps are simulation time
data_dir: ~/teleop_data         # the human's data; never inside a git checkout
low_rtf: 0.8                    # an episode whose real-time factor falls below this is flagged LOW_RTF
frames:
  base: xarm_link_base
  tool: xarm_link_tcp           # default; the tool_frame parameter in force is recorded too
recorder:
  node: teleop_episode_recorder
  namespace: ""
  storage: mcap
  storage_preset: zstd_fast     # MCAP chunk compression, lossless
  max_cache_size_mb: 512
disk:
  min_free_gb_to_start: 20
  min_free_gb_to_continue: 10
# Fitted consistency tolerances of config/checks.yaml this deployment sets differently (only
# consistency arm_rms_m, arm_p99_m, arm_rot_p99_deg, gripper_abs_rad may be set here).
# The checking tools apply the package's current copy of this block, also to episodes recorded
# before it changed; each check report names the source and lists the provisional values.
checks:
  consistency:
    arm_rot_p99_deg: 1.5        # set by hand; checks.yaml's 0.8 was fitted on scripted episodes
provisional:                    # set by hand, not fitted: refit with episode_fit on kept live episodes
  consistency.arm_rot_p99_deg: >-
    set by hand after the first live headset session (one kept episode at 0.94 deg against
    the 0.8 deg fitted on scripted episodes); replace with an episode_fit result
# Streams. kind: see streams.py. clock: robot = the host's ROS clock (simulation time here),
# host_wall = the host's system clock, none = no header. rate_hz: nominal, in the recording
# clock (null: an event stream, no rate or gap check). gate: rate and gaps are judged only in
# these spans (engaged = clutch engaged; gripper_active). required: START is refused while it
# is missing or below its rate (ungated streams only), and the checker fails without it.
# required_fields: optional fields (streams.py OPTIONAL_FIELDS) the episode fails without; here
# none, because Gazebo's joints declare no effort state interface and it publishes effort as NaN.
# count: the episode node counts publications in the episode, compared with the recording.
streams:
  state:            {topic: /teleop/state, kind: teleop_state, type: ranger_xarm_teleop_interfaces/msg/TeleopState, required: true, rate_hz: 50, clock: robot, count: true}
  target:           {topic: /teleop/target_pose, kind: pose, type: geometry_msgs/msg/PoseStamped, required: true, rate_hz: 50, clock: robot, gate: engaged, count: true}
  gripper_command:  {topic: /teleop/gripper/command, kind: gripper_command, type: ranger_xarm_teleop_interfaces/msg/GripperCommand, required: false, rate_hz: 50, clock: robot, gate: gripper_active, count: true}
  joint_command:    {topic: /servo_node/delta_joint_cmds, kind: joint_command, type: control_msgs/msg/JointJog, required: true, rate_hz: 50, clock: robot, gate: engaged, count: true}
  joint_states:     {topic: /joint_states, kind: joint_states, type: sensor_msgs/msg/JointState, required: true, rate_hz: 142.857, clock: robot, count: true}
  gripper_held:     {topic: /teleop/gripper/held, kind: other, type: control_msgs/msg/JointTrajectoryControllerState, required: false, rate_hz: null, clock: robot}
  owner:            {topic: /teleop/mux/owner, kind: owner, type: ranger_xarm_teleop_interfaces/msg/ArmOwner, required: false, rate_hz: null, clock: robot}
  input_right:      {topic: /teleop/input/right/pose, kind: pose, type: geometry_msgs/msg/PoseStamped, required: false, rate_hz: null, clock: host_wall}
  input_left:       {topic: /teleop/input/left/pose, kind: pose, type: geometry_msgs/msg/PoseStamped, required: false, rate_hz: null, clock: host_wall}
  input_head:       {topic: /teleop/input/head/pose, kind: pose, type: geometry_msgs/msg/PoseStamped, required: false, rate_hz: null, clock: host_wall}
  joy:              {topic: /teleop/input/joy, kind: joy, type: sensor_msgs/msg/Joy, required: true, rate_hz: null, clock: host_wall}
  status:           {topic: /teleop/input/status, kind: input_status, type: ranger_xarm_teleop_interfaces/msg/InputStatus, required: true, rate_hz: null, clock: host_wall, count: true}
  camera_gantry:    {topic: /camera/gantry_d455/color/image_raw, kind: image, type: sensor_msgs/msg/Image, required: true, rate_hz: 30, clock: robot, camera: gantry_d455, info: camera_gantry_info, image: {width: 848, height: 480, encoding: rgb8}}
  camera_gantry_info: {topic: /camera/gantry_d455/color/camera_info, kind: camera_info, type: sensor_msgs/msg/CameraInfo, required: true, rate_hz: 30, clock: robot, camera: gantry_d455, count: true}
  camera_wrist:     {topic: /camera/wrist_d435/color/image_raw, kind: image, type: sensor_msgs/msg/Image, required: true, rate_hz: 30, clock: robot, camera: wrist_d435, info: camera_wrist_info, image: {width: 848, height: 480, encoding: rgb8}}
  camera_wrist_info: {topic: /camera/wrist_d435/color/camera_info, kind: camera_info, type: sensor_msgs/msg/CameraInfo, required: true, rate_hz: 30, clock: robot, camera: wrist_d435, count: true}
  depth_gantry:     {topic: /camera/gantry_d455/depth/image_rect_raw, kind: image, type: sensor_msgs/msg/Image, required: false, record: false, rate_hz: 30, clock: robot, camera: gantry_d455, image: {width: 848, height: 480, encoding: 32FC1}}
  depth_wrist:      {topic: /camera/wrist_d435/depth/image_rect_raw, kind: image, type: sensor_msgs/msg/Image, required: false, record: false, rate_hz: 30, clock: robot, camera: wrist_d435, image: {width: 848, height: 480, encoding: 32FC1}}
  tf:               {topic: /tf, kind: other, type: tf2_msgs/msg/TFMessage, required: false, rate_hz: null, clock: robot}
  tf_static:        {topic: /tf_static, kind: other, type: tf2_msgs/msg/TFMessage, required: false, rate_hz: null, clock: robot}
  robot_description: {topic: /robot_description, kind: other, type: std_msgs/msg/String, required: false, rate_hz: null, clock: none}
  cmd_vel:          {topic: /cmd_vel, kind: twist, type: geometry_msgs/msg/Twist, required: false, rate_hz: null, clock: none, base: true}
  odom:             {topic: /odom, kind: odometry, type: nav_msgs/msg/Odometry, required: false, rate_hz: null, clock: robot, base: true}
  ground_truth_odom: {topic: /ground_truth/odom, kind: odometry, type: nav_msgs/msg/Odometry, required: false, rate_hz: null, clock: robot, base: true}
  base_cmd:         {topic: /teleop/base/cmd_vel, kind: twist_stamped, type: geometry_msgs/msg/TwistStamped, required: false, rate_hz: null, clock: robot, base: true}
  base_state:       {topic: /teleop/base/state, kind: base_state, type: ranger_xarm_teleop_interfaces/msg/BaseState, required: false, rate_hz: null, clock: robot}
  episode_state:    {topic: /teleop/episode/state, kind: episode_state, type: ranger_xarm_teleop_interfaces/msg/EpisodeState, required: true, rate_hz: 5, clock: robot}
  haptic:           {topic: /teleop/haptic, kind: other, type: ranger_xarm_teleop_interfaces/msg/Haptic, required: false, rate_hz: null, clock: robot}
  operator_status:  {topic: /teleop/operator/status, kind: other, type: ranger_xarm_teleop_interfaces/msg/OperatorStatus, required: false, rate_hz: null, clock: robot}
  parameter_events: {topic: /parameter_events, kind: other, type: rcl_interfaces/msg/ParameterEvent, required: false, rate_hz: null, clock: robot}
  rosout:           {topic: /rosout, kind: other, type: rcl_interfaces/msg/Log, required: false, rate_hz: null, clock: robot}
