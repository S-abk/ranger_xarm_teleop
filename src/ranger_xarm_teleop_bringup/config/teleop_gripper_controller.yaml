# The trajectory controller the gripper relay feeds while teleop owns the gripper. It claims
# the gripper's driven joint like MoveIt's gripper controller, so ros2_control lets only one of
# the two be active; the command mux swaps them together with the arm's. Loaded inactive by
# teleop_core.launch.py when gripper teleop is enabled.
teleop_gripper_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - xarm_drive_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    # Activation holds the joint's last command (what the previous owner commanded), not its
    # measured position: a finger blocked on an object keeps its squeeze over the switch.
    # This is the held reference the teleop node starts from.
    set_last_command_interface_value_as_state_on_activation: true
    # Each command continues from the last commanded position, not the measured one, so a
    # blocked finger does not pull the command back to the measured opening.
    interpolate_from_desired_state: true
    # No cmd_timeout: with one, the controller would hold the MEASURED position after the
    # teleop node goes silent (a freeze), which releases a grasp. Silent means: hold the
    # last command.
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    # A finger blocked on an object is not a fault: no path or goal tolerance (0 = unchecked).
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.0
      xarm_drive_joint:
        trajectory: 0.0
        goal: 0.0
