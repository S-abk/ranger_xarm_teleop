# The trajectory controller MoveIt Servo feeds. It claims the same arm joints as MoveIt's
# trajectory controller, so ros2_control lets only one of the two be active; the command
# mux switches between them. Loaded inactive by teleop_core.launch.py.
teleop_arm_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - xarm_joint1
      - xarm_joint2
      - xarm_joint3
      - xarm_joint4
      - xarm_joint5
      - xarm_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    # Streamed commands continue from the last commanded point, not from the measured
    # state, so tracking lag is not fed back into every new 20 ms segment.
    interpolate_from_desired_state: true
    # No command for this long after the last received point: hold position.
    cmd_timeout: 0.2
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.0
